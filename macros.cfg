# Prusa MK3s Klipper macros
#
# NOTE: PAUSE / RESUME / CANCEL_PRINT / _TOOLHEAD_PARK_PAUSE_CANCEL
# are provided by mainsail-config (mainsail.cfg) and are intentionally
# NOT overridden here.

######################################################################
## Mainsail client variables (used by the mainsail-config macros)
######################################################################
[gcode_macro _CLIENT_VARIABLE]
description: Mainsail pause/resume/cancel tuning
variable_use_custom_pos: False
variable_custom_park_x: 0.0
variable_custom_park_y: 0.0
variable_custom_park_dz: 2.0
variable_retract: 1.0
variable_cancel_retract: 5.0
variable_speed_retract: 35.0
variable_unretract: 1.0
variable_speed_unretract: 35.0
variable_speed_hop: 15.0
variable_speed_move: 100.0
variable_park_at_cancel: False
variable_park_at_cancel_x: None
variable_park_at_cancel_y: None
variable_use_fw_retract: False
variable_idle_timeout: 0
variable_runout_sensor: "filament_switch_sensor fsensor"
variable_user_pause_macro: ""
variable_user_resume_macro: "CLEAN_NOZZLE"
variable_user_cancel_macro: ""
gcode:

######################################################################
## Object exclusion
######################################################################
[exclude_object]

######################################################################
## Print start / end
######################################################################
[gcode_macro PRINT_START]
description: Start print, load the saved bed mesh profile
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(215)|float %}
    {% set PA = params.PA|default(0.045)|float %}
    {% set SOAK = params.SOAK|default(0)|int %}
    M117 Heating...
    M140 S{BED_TEMP}
    M104 S{(EXTRUDER_TEMP * 0.7)|round|int}
    SET_PRESSURE_ADVANCE ADVANCE={PA}
    CLEAR_PAUSE
    G90
    M190 S{BED_TEMP}
    {% if SOAK > 0 %}
    G4 P{SOAK * 1000}
    {% endif %}
    G28
    BED_MESH_PROFILE LOAD=default
    G1 Z12 F720
    G1 X253 Y2 F6000
    M109 S{EXTRUDER_TEMP}
    CLEAN_NOZZLE
    G1 X153 Y-3 F6000
    M117 Priming...
    G1 Z0.2 F720
    G92 E0
    G1 X60 E9 F1000
    G1 X100 E12.5 F1000
    G92 E0
    SKEW_PROFILE LOAD=mk3s
    M117

[gcode_macro PRINT_END]
description: End print, park and power down
gcode:
    M400
    G91
    G1 E-2 F2700
    G1 Z10 F720
    G90
    _TOOLHEAD_PARK_PAUSE_CANCEL
    TURN_OFF_HEATERS
    M106 S0
    BED_MESH_CLEAR
    SET_SKEW CLEAR=1
    M84 X Y E
    M117 Print complete

######################################################################
## PrusaSlicer compatibility
######################################################################
# --- Pressure advance: set by the slicer profile ---
# The MK4IS profiles emit M900 K0.07 / M572 S0.053; both are passed through
# to SET_PRESSURE_ADVANCE (M572 comes last in the gcode and wins).
# PRINT_START still sets 0.045 as default when the profile emits nothing.
[gcode_macro M572]
description: Marlin pressure advance -> Klipper SET_PRESSURE_ADVANCE
gcode:
    {% if params.S is defined %}
    SET_PRESSURE_ADVANCE ADVANCE={params.S|float}
    {% else %}
    {action_raise_error("M572 requires S=<advance>")}
    {% endif %}

[gcode_macro M900]
description: Marlin linear advance K -> Klipper pressure advance (only if K>0)
gcode:
    {% if params.K is defined and params.K|float > 0 %}
    SET_PRESSURE_ADVANCE ADVANCE={params.K|float}
    {% endif %}

######################################################################
## Filament change
######################################################################
[gcode_macro _FILAMENT_RUNOUT]
description: Filament runout - M600 only while a print is active
gcode:
    M118 Filament Runout Detected
    {% if printer.print_stats.state in ('printing', 'paused') %}
    M600
    {% endif %}

[gcode_macro M600]
description: Filament change
gcode:
    PAUSE
    SAVE_GCODE_STATE NAME=m600_state
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
    G1 E-50 F1000
    {% endif %}
    RESTORE_GCODE_STATE NAME=m600_state
    M117 Change filament, then run SWAP_RESUME

[gcode_macro SWAP_RESUME]
description: Resume after a filament change
gcode:
    {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G1 E50 F300
    G90
    {% endif %}
    RESUME

[gcode_macro UNLOAD_FILAMENT]
gcode:
  SAVE_GCODE_STATE NAME=unload_state
  G91
  {% if params.TEMP is defined or printer.extruder.can_extrude|lower == 'false' %}
    M117 Heating...
    # Heat up hotend to provided temp or 220 as default as that should work OK with most filaments.
    M109 S{params.TEMP|default(220, true)}
  {% endif %}
  M117 Unloading filament...
  G92 E0.0
  G91
  G1 E-45 F5000
  G1 E-15 F1000
  G1 E-20 F1000
  G90
  G92 E0.0
  M400
  M117 Remove Filament Now!
  M300 S300 P1000
  M117 Filament unloaded!
  RESTORE_GCODE_STATE NAME=unload_state

[gcode_macro LOAD_FILAMENT]
gcode:
  SAVE_GCODE_STATE NAME=load_state
  G91
  # Heat up hotend to provided temp or 220 as default as that should work OK with most filaments.
  {% if params.TEMP is defined or printer.extruder.can_extrude|lower == 'false' %}
  M117 Heating...
  M109 S{params.TEMP|default(220, true)}
  {% endif %}
  M117 Loading filament...
  # Load the filament into the hotend area.
  G92 E0.0
  G91
  G1 E70 F400
  G1 E40 F100
  G90
  G92 E0.0
  M400
  M117 Filament loaded!
  RESTORE_GCODE_STATE NAME=load_state

######################################################################
## Bed leveling helpers
######################################################################
[gcode_macro G80]
description: Run a full bed mesh calibration
gcode:
    M117 Bed leveling
    G28
    BED_MESH_CALIBRATE
    G1 X0 Y0 Z0.4 F4000
    M117
    M400

######################################################################
## Nozzle cleaning
######################################################################
[gcode_macro CLEAN_NOZZLE]
description: Wipe the nozzle on the brush (right corner, outside the bed)
gcode:
    {% set X = params.X|default(253.0)|float %}
    {% set Y = params.Y|default(2.0)|float %}
    {% set Z = params.Z|default(5.0)|float %}
    {% set SAFE_Z = params.SAFE_Z|default(12.0)|float %}
    {% set Y_MIN = params.Y_MIN|default(-3.0)|float %}
    {% set Y_MAX = params.Y_MAX|default(12.0)|float %}
    SAVE_GCODE_STATE NAME=clean_nozzle
    G90
    G1 Z{SAFE_Z} F720
    G1 X{X} Y{Y} F6000
    G1 Z{Z} F360
    G1 Y{Y_MIN} F1200
    G1 Y{Y_MAX} F1200
    G1 Y{Y_MIN} F1200
    G1 Y{Y_MAX} F1200
    G1 Z{SAFE_Z} F720
    RESTORE_GCODE_STATE NAME=clean_nozzle

######################################################################
## Z offset calibration
######################################################################
[gcode_macro _CALIBRATE_Z]
description: Internal - probe z_offset calibration (paper method)
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(215)|float %}
    {% set X = params.X|default(153)|float %}
    {% set Y = params.Y|default(132)|float %}
    M117 Z cal: heating...
    M140 S{BED_TEMP}
    M104 S{(EXTRUDER_TEMP * 0.7)|round|int}
    M190 S{BED_TEMP}
    G28
    G1 Z12 F720
    G1 X253 Y2 F6000
    M109 S{EXTRUDER_TEMP}
    CLEAN_NOZZLE
    G1 X{X} Y{Y} F6000
    BED_MESH_CLEAR
    PROBE_CALIBRATE
    M117 TESTZ Z=-0.1 / + / -- / ++, poi ACCEPT e SAVE_CONFIG

[gcode_macro CALIBRATE_Z_PLA]
description: Probe z_offset calibration with PLA (215/60)
gcode: _CALIBRATE_Z BED_TEMP=60 EXTRUDER_TEMP=215

[gcode_macro CALIBRATE_Z_PETG]
description: Probe z_offset calibration with PETG (240/85)
gcode: _CALIBRATE_Z BED_TEMP=85 EXTRUDER_TEMP=240

# First layer staircase test: prints COUNT solid patches (line spacing
# SPACING), each at a different gcode Z offset from
# CENTER-(COUNT-1)/2*STEP to CENTER+(COUNT-1)/2*STEP. The middle patch is
# the current offset (plus CENTER). Pick the best patch and apply:
#   SET_GCODE_OFFSET Z=<value> ; Z_OFFSET_APPLY_PROBE ; SAVE_CONFIG
[gcode_macro _Z_OFFSET_TEST]
description: Internal - first layer staircase test for the z_offset
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(85)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(240)|float %}
    {% set STEP = params.STEP|default(0.01)|float %}
    {% set CENTER = params.CENTER|default(0)|float %}
    {% set COUNT = params.COUNT|default(7)|int %}
    {% set SIZE = params.SIZE|default(24)|float %}
    {% set GAP = params.GAP|default(5)|float %}
    {% set SPACING = params.SPACING|default(0.45)|float %}
    {% set E_PER_MM = 0.0374 %}
    {% set TOTAL = COUNT * SIZE + (COUNT - 1) * GAP %}
    {% set X0 = (printer.toolhead.axis_maximum.x|float - TOTAL) / 2 %}
    {% set YC = 105 %}
    {% set Y0 = YC - SIZE / 2 %}
    {% set Y1 = YC + SIZE / 2 %}
    {% set N_LINES = ((SIZE - 2 * SPACING) / SPACING)|int %}
    M117 Z test: heating...
    M140 S{BED_TEMP}
    M104 S{(EXTRUDER_TEMP * 0.7)|round|int}
    M190 S{BED_TEMP}
    G28
    BED_MESH_PROFILE LOAD=default
    G1 Z12 F720
    G1 X253 Y2 F6000
    M109 S{EXTRUDER_TEMP}
    CLEAN_NOZZLE
    SET_GCODE_OFFSET Z=0
    G90
    M83
    G1 X{X0} Y{Y0 - 10} F6000
    G1 Z0.2 F720
    G1 X{X0 + 40} E{40 * 0.06} F1200
    {% for i in range(COUNT) %}
    {% set OFF = CENTER + (i - (COUNT - 1) / 2) * STEP %}
    {% set PX0 = X0 + i * (SIZE + GAP) %}
    {% set PX1 = PX0 + SIZE %}
    SET_GCODE_OFFSET Z={OFF}
    M117 Patch {'%d' % (i + 1)}: {'%+.3f' % OFF}
    G1 Z0.6 F720
    G1 X{PX0} Y{Y0} F6000
    G1 Z0.2 F720
    G1 X{PX1} Y{Y0} E{(SIZE * E_PER_MM)|round(4)} F1800
    G1 X{PX1} Y{Y1} E{(SIZE * E_PER_MM)|round(4)} F1800
    G1 X{PX0} Y{Y1} E{(SIZE * E_PER_MM)|round(4)} F1800
    G1 X{PX0} Y{Y0} E{(SIZE * E_PER_MM)|round(4)} F1800
    {% for n in range(N_LINES) %}
    {% set YY = Y0 + SPACING * (n + 1) %}
    {% if n % 2 == 0 %}
    G1 X{PX1} Y{YY} E{(SIZE * E_PER_MM)|round(4)} F1800
    {% else %}
    G1 X{PX0} Y{YY} E{(SIZE * E_PER_MM)|round(4)} F1800
    {% endif %}
    {% endfor %}
    {% endfor %}
    M82
    SET_GCODE_OFFSET Z=0
    G1 Z10 F720
    G1 X125 Y180 F6000
    TURN_OFF_HEATERS
    M117 Z test done - choose best patch

[gcode_macro Z_OFFSET_TEST_PLA]
description: First layer z_offset test with PLA (215/60)
gcode: _Z_OFFSET_TEST BED_TEMP=60 EXTRUDER_TEMP=215

[gcode_macro Z_OFFSET_TEST_PETG]
description: First layer z_offset test with PETG (240/85)
gcode: _Z_OFFSET_TEST BED_TEMP=85 EXTRUDER_TEMP=240

######################################################################
## Misc
######################################################################
[gcode_macro M300]
gcode:
    # Use a default 1kHz tone if S is omitted.
    {% set S = params.S|default(1000)|int %}
    # Use a 10ms duration is P is omitted.
    {% set P = params.P|default(100)|int %}
    SET_PIN PIN=BEEPER_pin VALUE=0.5 CYCLE_TIME={ 1.0/S if S > 0 else 1 }
    G4 P{P}
    SET_PIN PIN=BEEPER_pin VALUE=0

######################################################################
## Long pause
######################################################################
[gcode_macro LONG_PAUSE]
description: Pausa lunga - hotend spento, letto invariato, posizione mantenuta
gcode:
    PAUSE
    SET_IDLE_TIMEOUT TIMEOUT=0
    M104 S0
    M117 Pausa lunga attiva - usa LONG_RESUME

[gcode_macro LONG_RESUME]
description: Riprende dopo LONG_PAUSE
gcode:
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout|default(600)}
    M109 S{printer['gcode_macro RESUME'].last_extruder_temp.temp|default(200)}
    RESUME

######################################################################
## Idle timeout (pause safety)
######################################################################
# The default idle gcode is TURN_OFF_HEATERS + M84. M84 calls
# clear_homing_state(), so a pause long enough to trip the idle timeout
# (10 min) loses homing and RESUME fails with "Must home axis first".
# While a print is paused, turn the heaters off but keep the steppers
# enabled so position/homing is retained; M84 only runs when idle.
[idle_timeout]
timeout: 600
gcode:
    TURN_OFF_HEATERS
    {% if printer.print_stats.state != "paused" %}
    M84
    {% endif %}
