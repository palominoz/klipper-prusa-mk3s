# WARNING. DO NOT EDIT THIS FILE.
# To override settings from this file, you can copy and paste the relevant
# sections into your printer.cfg and change it there.

[output_pin LCD_backlight_pin]
pin: PE3
pwm: True
hardware_pwm: True

value: 1.0        # Full backlight
shutdown_value: 1 # Back to full backlight (without PWM) on restart
cycle_time: 0.001 # Default 0.1s cycle time flickers as hell

[display]
lcd_type: hd44780
rs_pin: PD5
e_pin: PF7
d4_pin: PF5
d5_pin: PG4
d6_pin: PH7
d7_pin: PG3
encoder_pins: ^PJ1,^PJ2
click_pin: ^!PH6

######################################################################
## Custom LCD menus (override of klippy/extras/display/menu.cfg)
######################################################################

# Backlight is fixed at 100% (no brightness menu).

# Bed mesh: run the repo G80 macro (homes first, then BED_MESH_CALIBRATE).
[menu __main __control __bed_mesh]
type: command
enable: {not printer.idle_timeout.state == "Printing" and ('bed_mesh' in printer)}
name: Bed Mesh
gcode: G80

# PLA preheat preset (215/60).
[menu __main __temp __preheat_pla]
type: list
name: Preheat PLA

[menu __main __temp __preheat_pla __all]
type: command
enable: {('extruder' in printer) and ('heater_bed' in printer)}
name: Preheat all
gcode:
    M140 S60
    M104 S215

[menu __main __temp __preheat_pla __hotend]
type: command
enable: {'extruder' in printer}
name: Preheat hotend
gcode: M104 S215

[menu __main __temp __preheat_pla __hotbed]
type: command
enable: {'heater_bed' in printer}
name: Preheat hotbed
gcode: M140 S60

# PETG preheat preset (matches the calibrated profiles: 240/85).
[menu __main __temp __preheat_petg]
type: list
index: 5
name: Preheat PETG

[menu __main __temp __preheat_petg __all]
type: command
enable: {('extruder' in printer) and ('heater_bed' in printer)}
name: Preheat all
gcode:
    M140 S85
    M104 S240

[menu __main __temp __preheat_petg __hotend]
type: command
enable: {'extruder' in printer}
name: Preheat hotend
gcode: M104 S240

[menu __main __temp __preheat_petg __hotbed]
type: command
enable: {'heater_bed' in printer}
name: Preheat hotbed
gcode: M140 S85

# Filament: use the repo macros (they heat the nozzle if needed).
[menu __main __filament __loadf]
type: command
name: Load Filament
gcode: LOAD_FILAMENT

[menu __main __filament __loads]
type: disabled

[menu __main __filament __unloadf]
type: command
name: Unload Filament
gcode: UNLOAD_FILAMENT

[menu __main __filament __unloads]
type: disabled

[menu __main __filament __swap]
type: command
enable: {printer.pause_resume.is_paused}
name: Resume after swap
gcode: SWAP_RESUME

# Wipe the nozzle on the brush (right corner, outside the bed).
[menu __main __control __clean_nozzle]
type: command
enable: {not printer.idle_timeout.state == "Printing" and ("xyz" in printer.toolhead.homed_axes)}
name: Clean Nozzle
gcode: CLEAN_NOZZLE

# Long pause: hotend off, idle timeout disabled (use Long Resume to restart).
[menu __main __control __long_pause]
type: command
enable: {printer.idle_timeout.state == "Printing"}
name: Long Pause
gcode: LONG_PAUSE

[menu __main __control __long_resume]
type: command
enable: {printer.pause_resume.is_paused}
name: Long Resume
gcode: LONG_RESUME

# Quick axis jogging (X/Y in 10 mm steps, Z in 1 mm steps). The built-in
# Control menu also has 10/1/0.1 mm move submenus.
[menu __main __move]
type: list
index: 3
name: Move

[menu __main __move __axis_x]
type: input
name: Move X:{'%05.1f' % menu.input}
input: {printer.gcode_move.gcode_position.x}
input_min: {printer.toolhead.axis_minimum.x}
input_max: {printer.toolhead.axis_maximum.x}
input_step: 10.0
gcode:
    SAVE_GCODE_STATE NAME=__move__axis
    G90
    G1 X{menu.input} F3000
    RESTORE_GCODE_STATE NAME=__move__axis

[menu __main __move __axis_y]
type: input
name: Move Y:{'%05.1f' % menu.input}
input: {printer.gcode_move.gcode_position.y}
input_min: {printer.toolhead.axis_minimum.y}
input_max: {printer.toolhead.axis_maximum.y}
input_step: 10.0
gcode:
    SAVE_GCODE_STATE NAME=__move__axis
    G90
    G1 Y{menu.input} F3000
    RESTORE_GCODE_STATE NAME=__move__axis

[menu __main __move __axis_z]
type: input
name: Move Z:{'%05.1f' % menu.input}
input: {printer.gcode_move.gcode_position.z}
input_min: 0
input_max: {printer.toolhead.axis_maximum.z}
input_step: 1.0
gcode:
    SAVE_GCODE_STATE NAME=__move__axis
    G90
    G1 Z{menu.input} F600
    RESTORE_GCODE_STATE NAME=__move__axis
