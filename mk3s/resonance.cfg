# Resonance / input shaper measurement config (PIS RP2040 + ADXL345)
#
# WARNING: only include this file when the PIS board is connected, otherwise
# Klipper will not start (secondary MCU unavailable).

[mcu PIS]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E6635C469F996237-if00

[adxl345 adxl]
cs_pin: PIS:gpio13
spi_software_sclk_pin: PIS:gpio10
spi_software_mosi_pin: PIS:gpio11
spi_software_miso_pin: PIS:gpio12
# Mount: bed (active). Verified 2026-10-05: gravity on raw Y, Y moves on raw Z.
axes_map: x,z,-y
# Mount: toolhead - comment the line above and uncomment this one when the
# ADXL is mounted on the toolhead.
#axes_map: x,y,z

[resonance_tester]
accel_chip: adxl345 adxl
probe_points:
    105,30,20
    105,105,20
    105,180,20
